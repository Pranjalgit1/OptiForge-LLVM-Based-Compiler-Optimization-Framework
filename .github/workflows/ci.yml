name: LLVM 21 build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install matching LLVM 21 development tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-21 llvm-21-dev llvm-21-tools cmake ninja-build python3 git
      - name: Check toolchain
        run: python3 scripts/setup_check.py
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER=/usr/lib/llvm-21/bin/clang \
            -DCMAKE_CXX_COMPILER=/usr/lib/llvm-21/bin/clang++ \
            -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm
      - name: Build
        run: cmake --build build -j2
      - name: Test IR, execution, and benchmark runner
        run: ctest --test-dir build --output-on-failure
